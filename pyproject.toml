[project]
name = "mimir"
version = "0.1.0"
description = "An IDE whose only user is an AI agent, served over MCP"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "pyflakes>=3", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mimir"]

[project.scripts]
mimir = "mimir.server:main"
mimir-dashboard = "mimir.dashboard:main"

[tool.pytest.ini_options]
testpaths = ["tests"]   # demo_shop's tests fail on purpose

[tool.setuptools.package-data]
mimir = ["*.html"]
