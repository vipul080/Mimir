[project]
name = "mimir"
version = "0.1.0"
description = "An IDE for AI agents (Claude, Gemini, ChatGPT and others), served over MCP and a CLI"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "pyflakes>=3", "pytest>=8", "tree-sitter>=0.25", "tree-sitter-java>=0.23", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mimir", "mimir.lang"]

[project.scripts]
mimir = "mimir.cli:main"
mimir-dashboard = "mimir.dashboard:main"

[tool.pytest.ini_options]
testpaths = ["tests"]   # demo_shop's tests fail on purpose

[tool.setuptools.package-data]
mimir = ["*.html"]
